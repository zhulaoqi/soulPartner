<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF0E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE5F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bannerHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA07A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB88C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA07A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="400" fill="url(#bannerBg)"/>
  
  <!-- 装饰圆圈 - 背景层 -->
  <circle cx="100" cy="80" r="60" fill="#FFD6E0" opacity="0.3"/>
  <circle cx="1100" cy="320" r="80" fill="#FFDAB9" opacity="0.3"/>
  <circle cx="950" cy="100" r="50" fill="#FFE4E1" opacity="0.3"/>
  
  <!-- 左侧装饰心形群 -->
  <g opacity="0.6">
    <path d="M120 200 C 105 190, 90 185, 90 170 C 90 160, 95 155, 105 155 C 112 155, 116 160, 120 168 C 124 160, 128 155, 135 155 C 145 155, 150 160, 150 170 C 150 185, 135 190, 120 200 Z" 
          fill="#FF9A9E" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g opacity="0.6">
    <path d="M180 280 C 170 273, 160 270, 160 260 C 160 253, 163 250, 170 250 C 175 250, 177 253, 180 258 C 183 253, 185 250, 190 250 C 197 250, 200 253, 200 260 C 200 270, 190 273, 180 280 Z" 
          fill="#FFB88C" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 右侧装饰心形群 -->
  <g opacity="0.6">
    <path d="M1050 150 C 1035 140, 1020 135, 1020 120 C 1020 110, 1025 105, 1035 105 C 1042 105, 1046 110, 1050 118 C 1054 110, 1058 105, 1065 105 C 1075 105, 1080 110, 1080 120 C 1080 135, 1065 140, 1050 150 Z" 
          fill="#FFA07A" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 中央主视觉 - 大心形 -->
  <g transform="translate(300, 200)">
    <!-- 主心形 -->
    <path d="M0 80 C -50 40, -90 20, -90 -20 C -90 -55, -70 -75, -35 -75 C -15 -75, 0 -60, 0 -40 C 0 -60, 15 -75, 35 -75 C 70 -75, 90 -55, 90 -20 C 90 20, 50 40, 0 80 Z" 
          fill="url(#bannerHeart)" 
          stroke="#FF9A9E" 
          stroke-width="3">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- 内部装饰 -->
    <circle cx="0" cy="-10" r="25" fill="#FFF" opacity="0.3"/>
    <circle cx="-15" cy="5" r="12" fill="#FFF" opacity="0.4"/>
    <circle cx="15" cy="5" r="12" fill="#FFF" opacity="0.4"/>
  </g>
  
  <!-- 文字区域 -->
  <g transform="translate(480, 150)">
    <!-- 主标题 -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGradient)">
      心灵陪伴
    </text>
    
    <!-- 英文标题 -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="36" fill="#FFA07A" opacity="0.8">
      Soul Partner
    </text>
    
    <!-- 描述文字 -->
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="24" fill="#FF6B9D" opacity="0.7">
      温暖陪伴 · 用心倾听 · 智能关怀
    </text>
    
    <!-- 装饰线 -->
    <line x1="0" y1="115" x2="500" y2="115" stroke="#FFB88C" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- 右下角装饰元素 -->
  <g opacity="0.4">
    <!-- 小星星 -->
    <circle cx="850" cy="320" r="6" fill="#FF9A9E">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="340" r="5" fill="#FFA07A">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="360" r="4" fill="#FFB88C">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 飘动的小心形装饰 -->
  <g opacity="0.3">
    <path d="M400 350 C 395 347, 390 345, 390 340 C 390 336, 392 334, 395 334 C 397 334, 398 336, 400 338 C 402 336, 403 334, 405 334 C 408 334, 410 336, 410 340 C 410 345, 405 347, 400 350 Z" 
          fill="#FF6B9D">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g opacity="0.3">
    <path d="M750 80 C 745 77, 740 75, 740 70 C 740 66, 742 64, 745 64 C 747 64, 748 66, 750 68 C 752 66, 753 64, 755 64 C 758 64, 760 66, 760 70 C 760 75, 755 77, 750 80 Z" 
          fill="#FFA07A">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-25; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>

