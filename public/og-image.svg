<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF0E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE5F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ogHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA07A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB88C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ogText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA07A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- 装饰圆圈 -->
  <circle cx="150" cy="120" r="80" fill="#FFD6E0" opacity="0.3"/>
  <circle cx="1050" cy="510" r="100" fill="#FFDAB9" opacity="0.3"/>
  <circle cx="950" cy="150" r="60" fill="#FFE4E1" opacity="0.3"/>
  <circle cx="250" cy="500" r="70" fill="#FFE4E1" opacity="0.3"/>
  
  <!-- 左侧Logo区域 -->
  <g transform="translate(250, 315)">
    <!-- 大心形 -->
    <path d="M0 100 C -60 50, -110 25, -110 -25 C -110 -68, -85 -92, -43 -92 C -18 -92, 0 -73, 0 -49 C 0 -73, 18 -92, 43 -92 C 85 -92, 110 -68, 110 -25 C 110 25, 60 50, 0 100 Z" 
          fill="url(#ogHeart)" 
          stroke="#FF9A9E" 
          stroke-width="4"
          filter="url(#glow)"/>
    
    <!-- 内部装饰 -->
    <circle cx="0" cy="-12" r="30" fill="#FFF" opacity="0.3"/>
    <circle cx="-20" cy="6" r="15" fill="#FFF" opacity="0.4"/>
    <circle cx="20" cy="6" r="15" fill="#FFF" opacity="0.4"/>
  </g>
  
  <!-- 右侧文字区域 -->
  <g transform="translate(480, 250)">
    <!-- 主标题 -->
    <text x="0" y="0" font-family="Arial, -apple-system, BlinkMacSystemFont, sans-serif" font-size="88" font-weight="bold" fill="url(#ogText)">
      心灵陪伴
    </text>
    
    <!-- 英文标题 -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="42" fill="#FFA07A" opacity="0.9">
      Soul Partner
    </text>
    
    <!-- 分隔线 -->
    <line x1="0" y1="90" x2="500" y2="90" stroke="#FFB88C" stroke-width="3" opacity="0.5"/>
    
    <!-- 描述文字 -->
    <text x="0" y="135" font-family="Arial, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" fill="#FF6B9D" opacity="0.8">
      温暖陪伴 · 用心倾听 · 智能关怀
    </text>
    
    <!-- 特性标签 -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#FF9A9E" opacity="0.2"/>
      <text x="70" y="27" font-family="Arial, sans-serif" font-size="18" fill="#FF6B9D" text-anchor="middle" font-weight="600">
        ⚡ 流式AI
      </text>
      
      <rect x="160" y="0" width="140" height="40" rx="20" fill="#FFA07A" opacity="0.2"/>
      <text x="230" y="27" font-family="Arial, sans-serif" font-size="18" fill="#FF6B9D" text-anchor="middle" font-weight="600">
        🎨 温馨设计
      </text>
      
      <rect x="320" y="0" width="140" height="40" rx="20" fill="#FFB88C" opacity="0.2"/>
      <text x="390" y="27" font-family="Arial, sans-serif" font-size="18" fill="#FF6B9D" text-anchor="middle" font-weight="600">
        📱 全端适配
      </text>
    </g>
  </g>
  
  <!-- 装饰小心形 -->
  <g opacity="0.4">
    <path d="M120 550 C 110 543, 100 540, 100 530 C 100 523, 103 520, 110 520 C 115 520, 117 523, 120 528 C 123 523, 125 520, 130 520 C 137 520, 140 523, 140 530 C 140 540, 130 543, 120 550 Z" 
          fill="#FF6B9D"/>
  </g>
  
  <g opacity="0.4">
    <path d="M1080 120 C 1070 113, 1060 110, 1060 100 C 1060 93, 1063 90, 1070 90 C 1075 90, 1077 93, 1080 98 C 1083 93, 1085 90, 1090 90 C 1097 90, 1100 93, 1100 100 C 1100 110, 1090 113, 1080 120 Z" 
          fill="#FFA07A"/>
  </g>
  
  <!-- 底部说明 -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="20" fill="#FF6B9D" opacity="0.6" text-anchor="middle">
    💝 专业心理陪伴 · AI智能对话 · 随时随地倾听
  </text>
</svg>

